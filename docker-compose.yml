# OrbStack:  HOST_PORT=7821 docker compose up --build -d   ->  http://127.0.0.1:7821
# The server binds 0.0.0.0 INSIDE the container (PVL_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7800-7999.
name: poppy-verification

services:
  poppy-verification:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7821}:7821"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "7821"
      # The name the family lab-proxy (https://local.ping-devops.com:8443) sends in Host; loopback is always accepted.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-poppy-verification.local.ping-devops.com}
      PVL_BIND: 0.0.0.0
      # Rule 19: the app starts in Mock (an in-process reference Company and issuer) and switches to Real at runtime
      # when Real is configured (an agent URL a real issuer can fetch, and the Company and issuer you type).
      MODE: ${MODE:-}
      PVL_DATA_DIR: /data
      PVL_AGENT_BASE_URL: ${PVL_AGENT_BASE_URL:-}
      PVL_AGENT_HOST: ${PVL_AGENT_HOST:-}
      PVL_TLS_CERT: ${PVL_TLS_CERT:-}
      PVL_TLS_KEY: ${PVL_TLS_KEY:-}
      # One-click defaults for the Real form (empty = the visitor types their own; shipped text stays .example).
      PVL_DEMO_COMPANY_ORIGIN: ${PVL_DEMO_COMPANY_ORIGIN:-}
      PVL_DEMO_PF_ISSUER: ${PVL_DEMO_PF_ISSUER:-}
      PVL_DEMO_P1_ISSUER: ${PVL_DEMO_P1_ISSUER:-}
      PVL_DEMO_SCOPE: ${PVL_DEMO_SCOPE:-}
      PVL_DEMO_LOGIN_HINT: ${PVL_DEMO_LOGIN_HINT:-}
      # Optional live Claude agent behind the Agent chat tab (empty = guided script). Never returned or logged.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PVL_CHAT_MODEL: ${PVL_CHAT_MODEL:-}
    read_only: true
    volumes:
      - agent-data:/data
      - ${PVL_TLS_CERT_DIR:-/dev/null}:/certs:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7821/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3

volumes:
  agent-data:
