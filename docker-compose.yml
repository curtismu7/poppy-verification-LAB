# OrbStack:  HOST_PORT=7821 docker compose up --build -d   ->  http://127.0.0.1:7821
# The server binds 0.0.0.0 INSIDE the container (PVL_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7800-7999.
name: poppy-verification

services:
  poppy-verification:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7821}:7821"
    environment:
      SHELF_URL: ${SHELF_URL:-https://local.ping-devops.com:8443/demo-shelf}
      PORT: "7821"
      # The name the family lab-proxy (https://local.ping-devops.com:8443) sends in Host; loopback is always accepted.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-poppy-verification.local.ping-devops.com}
      PVL_BIND: 0.0.0.0
      # Rule 19: the app starts in Mock (an in-process reference Company and issuer) and switches to Real at runtime
      # when Real is configured (an agent URL a real issuer can fetch, and the Company and issuer you type).
      MODE: ${MODE:-}
      PVL_DATA_DIR: /data
      PVL_AGENT_BASE_URL: ${PVL_AGENT_BASE_URL:-}
      PVL_AGENT_HOST: ${PVL_AGENT_HOST:-}
      PVL_TLS_CERT: ${PVL_TLS_CERT:-}
      PVL_TLS_KEY: ${PVL_TLS_KEY:-}
      # A local Real run: the Company and issuer present mkcert certs; the bundle is in the /certs mount below.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # One-click defaults for the Real form (empty = the visitor types their own; shipped text stays .example).
      PVL_DEMO_COMPANY_ORIGIN: ${PVL_DEMO_COMPANY_ORIGIN:-}
      PVL_DEMO_PF_ISSUER: ${PVL_DEMO_PF_ISSUER:-}
      PVL_DEMO_P1_ISSUER: ${PVL_DEMO_P1_ISSUER:-}
      PVL_DEMO_SCOPE: ${PVL_DEMO_SCOPE:-}
      PVL_DEMO_LOGIN_HINT: ${PVL_DEMO_LOGIN_HINT:-}
      # Headless sign-in for the Real Verify suite (optional, never a default, never returned or logged).
      PVL_SIGNIN_USER: ${PVL_SIGNIN_USER:-}
      PVL_SIGNIN_PASSWORD: ${PVL_SIGNIN_PASSWORD:-}
      # Optional live Claude agent behind the Agent chat tab (empty = guided script). Never returned or logged.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PVL_CHAT_MODEL: ${PVL_CHAT_MODEL:-}
    read_only: true
    volumes:
      - agent-data:/data
      - ${PVL_TLS_CERT_DIR:-/dev/null}:/certs:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A local Real run: the Company and issuer are names on the HOST ( OrbStack: host.docker.internal), not inside this
    # container's network. /etc/hosts on the host maps them to 127.0.0.1, which here would be the container itself.
    extra_hosts:
      - "aidemo.ping.demo:host-gateway"
      - "local.ping-devops.com:host-gateway"
    healthcheck:
      # TLS when the agent URL is https (a local Real run), else plain http (the shelf's default).
      test: ["CMD", "node", "-e", "const u=process.env.PVL_TLS_CERT?'https':'http'; fetch(u+'://127.0.0.1:7821/api/health',{rejectUnauthorized:false}).then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3

volumes:
  agent-data:
